<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="author" content="Nicole Ochay">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title> Agendamento </title>

    <link rel="stylesheet" href="css/salao.css">
    <script src="js/salao.js"></script>

</head>

<body>
    
    <h2>AGENDAMENTO</h2>

    <ul class="menu">
        <li><a href="index.html" target="principal">PÁGINA INICIAL</a></li>
    </ul>

    <fieldset>
        <legend><strong>DADOS DO AGENDAMENTO</strong></legend>

        <form onsubmit="cadastrarAgendamento(); return false;">
            <label><strong>Nome do Cliente: </strong></label>
            <input type="text" id="nome" style="width: 98%; padding: 10px;" required><br><br>

            <label><strong>Profissional Preferido</strong></label><br>
            <select id="profissional">
                <option value="Carlos (Cabeleireiro)">Carlos (Cabeleireiro)</option>
                <option value="Mariana (Cabeleireira)">Mariana (Cabeleireira)</option>
                <option value="Roberto (Barbeiro)">Roberto (Barbeiro)</option>
                <option value="Ana (Esteticista)">Ana (Esteticista)</option>
                <option value="Indiferente">Indiferente</option>
            </select><br><br>

            <label><strong>Sexo</strong></label>
            <input type="radio" name="sexo" value="Masculino" required> Masculino
            <input type="radio" name="sexo" value="Feminino" required> Feminino 
            <br><br>

            <label><strong>Serviços Desejados</strong></label>

            <input type="checkbox" class="serv" value="Corte">Corte de Cabelo
            <input type="checkbox" class="serv" value="Barba">Barba
            <input type="checkbox" class="serv" value="Pintura">Pintura
            <input type="checkbox" class="serv" value="Escova / Hidratação">Escova / Hidratação
            <input type="checkbox" class="serv" value="Manicure e Pedicure">Manicure e Pedicure <br><br>

            <label><strong>Data do Atendimento:</strong></label>
            <input type="date" id="data" required><br><br>

            <label><strong>Horário:</strong></label>
            <input type="time" id="horario" style="padding: 8px;" required><br><br>

            <input class="botao" type="submit" value="CONFIRMAR AGENDAMENTO">
        </form>
    </fieldset>

    <div id="resultado" style="margin-top: 20px; min-width: 50px;"></div>
</body>
</html>
